# Baut die Einzeldateien fuer Linux und Windows und haengt sie an ein Release.
# Wird von tools/release.sh gestartet (Release als Entwurf -> bauen -> veroeffentlichen).
# Vor dem Hochladen startet jede Datei einmal im Selbsttest (Fenster + Firmware-Tool);
# veroeffentlicht wird nur, wenn beide Builds durchgelaufen sind.
name: Release bauen

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z.B. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Debian-Python statt actions/setup-python: dessen Tk stuerzt unter Xvfb ab (Segfault).
    # Bookworm (glibc 2.36) wie beim Bauen auf werkbank; laeuft auf allen aktuellen Distributionen.
    runs-on: ubuntu-latest
    container: python:3.10-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Abhaengigkeiten
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb xauth
          pip install -q pyinstaller customtkinter pyserial requests
      - name: Bauen
        run: |
          pyinstaller --onefile --windowed --add-data "icon.png:." --add-data "assets:assets" --add-binary "bin/nrfutil:." \
            --name SmolSlimeConfigurator-Linux SmolSlimeConfiguratorV9.py
          ls -l dist
      - name: Selbsttest
        run: SMOLSLIME_SELFTEST=1 timeout 60 xvfb-run -a dist/SmolSlimeConfigurator-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/SmolSlimeConfigurator-Linux

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Abhaengigkeiten
        run: pip install pyinstaller customtkinter pyserial requests pywin32
      - name: Bauen
        shell: bash
        run: |
          pyinstaller --onefile --windowed --icon=icon.ico --add-data "icon.ico;." --add-data "icon.png;." --add-data "assets;assets" \
            --name SmolSlimeConfigurator-Windows SmolSlimeConfiguratorV9.py
          ls -l dist
      - name: Selbsttest
        shell: pwsh
        run: |
          $env:SMOLSLIME_SELFTEST = "1"
          $p = Start-Process -FilePath "dist\SmolSlimeConfigurator-Windows.exe" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Selbsttest: haengt" }
          if ($p.ExitCode -ne 0) { throw "Selbsttest: Exitcode $($p.ExitCode)" }
      - name: Setup bauen
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = "${{ inputs.tag }}".TrimStart("v")
          iscc "/DMyAppVersion=$ver" windows\smolslime-setup.iss
      - name: Setup pruefen (still installieren und wieder entfernen)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\smolslime-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup: Exitcode $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\SmolSlime Configurator\SmolSlimeConfigurator.exe"
          if (-not (Test-Path $exe)) { throw "Setup: $exe fehlt" }
          $u = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\SmolSlime Configurator\unins000.exe" -ArgumentList "/VERYSILENT" -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Deinstallation: Exitcode $($u.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/SmolSlimeConfigurator-Windows.exe
            dist/smolslime-setup.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Hochladen und veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          gh release upload "${{ inputs.tag }}" out/* --clobber --repo "${{ github.repository }}"
          gh release edit "${{ inputs.tag }}" --draft=false --latest --repo "${{ github.repository }}"
